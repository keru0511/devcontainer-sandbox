version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - exhaustive
  settings:
    goimports:
      local-prefixes: github.com/quest-one/quest-one
    errcheck:
      # defer X.Close() and fmt.Print* are idiomatic patterns; errors are not actionable.
      exclude-functions:
        - (io.Closer).Close
        - (*net/http.Response.Body).Close
        - (*database/sql.Rows).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fscanln
    revive:
      rules:
        # exported doc-comment rules are too noisy for internal-only packages.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/quest-one/quest-one

issues:
  exclude-rules:
    # Templ-generated files.
    - path: "_templ\\.go"
      linters: [all]
