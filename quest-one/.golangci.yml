run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - exhaustive

linters-settings:
  goimports:
    local-prefixes: github.com/quest-one/quest-one
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    # Allow unused parameters in interface implementations
    - linters: [revive]
      text: "unused-parameter"
    # Templ-generated files
    - path: "_templ.go"
      linters: [all]
