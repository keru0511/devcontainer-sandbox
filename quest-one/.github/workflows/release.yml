name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest  # macOS runner for Universal Binary
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate code
        run: make generate

      - name: Build Universal Binary
        run: make build-darwin-universal

      - name: Create release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          tar -czf quest-one-${VERSION}-darwin-universal.tar.gz quest-one-darwin-universal
          sha256sum quest-one-${VERSION}-darwin-universal.tar.gz > quest-one-${VERSION}-darwin-universal.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quest-one-*-darwin-universal.tar.gz
            quest-one-*-darwin-universal.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
